# Local development relay: Postgres + Redis + API.
#
# Copyright (C) 2026 Jan Richter
# SPDX-License-Identifier: AGPL-3.0-only
#
# P4.S02's anti-goal is "expose Postgres/Redis to the host network", and this file
# is where that is either honoured or violated. Only `api` has a `ports:` entry,
# and it binds 127.0.0.1 explicitly.
#
# `ports: "8080:8080"` — the form everyone writes — binds 0.0.0.0, which publishes
# the service to every interface including the LAN. On a laptop on a café network
# that is a relay on the internet. The 127.0.0.1 prefix below is the entire
# difference and it is one that is easy to drop by accident.
#
# Nothing here is production configuration. TLS terminates at a reverse proxy in
# P5; there is no proxy in P4 because there is no host to put one on.
#
# # Every service is confined, not only `api` (AUDIT 5.28)
#
# `api` was given cap_drop, no-new-privileges and a read-only rootfs while
# postgres and redis ran with Docker's default capability set and no ceiling on
# memory, CPU or process count. That is the wrong way round for what each one
# holds: the relay container holds a static binary and a directory of client-
# encrypted blobs, while Postgres holds every account row, every public identity
# key and every undelivered envelope — the database THREAT_MODEL.md §1.1 assumes
# an adversary is trying to reach. Confining the process that handles requests and
# leaving the process that holds the data unconfined protects the wrong asset.
#
# Two things are being bounded, and they are separate:
#
#   * **Privilege.** Capabilities are dropped and only those the image's entrypoint
#     actually needs are added back — the alpine images start as root to fix
#     ownership and then `su-exec` to their service account, which is why CHOWN,
#     SETUID and SETGID appear and nothing else does.
#   * **Resources.** A limit here is a containment control, not tuning. Redis holds
#     every rate-limit bucket and has no persistence, so anything that restarts it
#     grants every caller a fresh allowance (AUDIT 5.24) — including the
#     invite-redemption brute-force limit and the prekey-drain limit AUDIT 3.1
#     depends on. Without a ceiling, the way Redis restarts is the kernel OOM
#     killer, which is reachable by traffic rather than by a deploy.

name: cipher-relay

services:
  postgres:
    # postgres:18-alpine, pinned by digest — see Dockerfile for why.
    image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # scram-sha-256 rather than the image's md5 default. md5 authentication is
      # broken for the purpose it serves, and the initdb argument has to be given
      # at first init — changing it later requires recreating the volume.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # No ports:. Reachable only from the compose network, by service name.
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data.
      #
      # Postgres 18 changed this. The image now stores data in a major-version
      # subdirectory so `pg_upgrade --link` can work without crossing a mount
      # boundary, and it refuses to start if it finds data at the old path —
      # which is the path every tutorial and every pre-18 compose file uses.
      # The failure is a wall of text about pg_ctlcluster that does not obviously
      # say "your mount point is wrong".
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # The image's entrypoint starts as root to take ownership of the data
    # directory and then drops to the postgres account with su-exec. CHOWN and
    # FOWNER are for that ownership pass, DAC_OVERRIDE lets it read the socket
    # directory it has just re-owned, and SETUID/SETGID are the drop itself.
    # Everything else — NET_RAW, NET_BIND_SERVICE, MKNOD, SYS_CHROOT, KILL,
    # AUDIT_WRITE — is in Docker's default set and is not used by a database.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    # Not read_only. Postgres writes its socket, its lock files and its
    # statistics outside the data volume, and the paths differ by version — a
    # rootfs lockdown here would be a tmpfs list that silently rots at the next
    # image bump. Recorded as the residual it is (AUDIT 5.28) rather than
    # written around; the capability set above is what confines this container.
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512

  redis:
    # redis:8-alpine, pinned by digest.
    image: redis@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    restart: unless-stopped
    # --save "" disables RDB snapshotting and --appendonly no disables the AOF.
    #
    # This is the most important line in this file. Redis persistence is ON by
    # default, and BACKEND.md §3 keeps only ephemeral routing metadata there —
    # rate-limit counters, presence, quota. Left at the default, all of it is
    # written to disk, which silently reinstates the retention the schema is
    # designed to avoid. The relay refuses to start if it finds persistence
    # enabled (cache.AssertNoPersistence), so this cannot rot unnoticed.
    #
    # --maxmemory is the other half of mem_limit below, and it is a security
    # setting rather than a tuning one. With only the container limit, Redis
    # filling up is resolved by the kernel OOM killer: the process dies, and
    # because persistence is off it comes back holding no rate-limit buckets at
    # all — every caller granted a fresh allowance by traffic alone (AUDIT 5.24
    # records the same harm arriving through a restart). With a Redis-side
    # ceiling below the container's, a full Redis instead *refuses the write*,
    # which every limiter call site already treats as fail-closed: the request is
    # refused with 503 rather than silently permitted.
    #
    # noeviction is stated explicitly even though it is the default, because the
    # eviction policies are the trap here — allkeys-lru would quietly discard
    # rate-limit buckets under pressure, which is the same reset in slow motion
    # and would look like correct operation.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # No ports:, and no volume — persistence is off, so a volume would only give
    # it somewhere to write if the flags above were ever dropped.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # Same entrypoint shape as postgres: root long enough to own /data, then
    # su-exec to the redis account. No FOWNER — it changes ownership of a
    # directory it created, never of one it does not own.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    # read_only here, unlike postgres: with persistence off Redis writes nothing
    # to disk, which is the whole point of the flags above, so a writable
    # filesystem is somewhere for a future misconfiguration to land. /data is a
    # tmpfs so the entrypoint's chown still succeeds — and a tmpfs is memory,
    # so anything written there dies with the container instead of reaching a
    # disk the retention policy does not cover.
    read_only: true
    tmpfs:
      - /data:mode=0700,size=16m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # The only published port, and only on loopback. See the header.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      RELAY_LISTEN_ADDR: ":8080"
      # sslmode=disable is correct here and only here: this connection never
      # leaves the container network, and there is no CA to validate against in a
      # local compose stack. P5 moves Postgres behind TLS with a real trust store.
      RELAY_DATABASE_URL: >-
        postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RELAY_REDIS_ADDR: "redis:6379"
      RELAY_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
      RELAY_BLOB_DIR: /var/lib/cipher/blobs
      # Empty by default, and empty means "a fresh one per process", which resets
      # every rate-limit bucket on every restart. Set it in .env for a deployment
      # that is not restarted casually; docs/BACKEND.md §5 argues both sides.
      RELAY_RATELIMIT_PEPPER: ${RELAY_RATELIMIT_PEPPER:-}
      # Empty by default, and empty means trust nobody: X-Real-IP is ignored and
      # the TCP peer is the client. Correct for local development, where there is
      # no proxy — and the safe way to be wrong in production, since the failure
      # is over-throttling rather than no throttling. docs/BACKEND.md §9.2.
      #
      # Behind Nginx this is NOT 127.0.0.1: docker-proxy opens a fresh connection
      # into the container from the compose bridge GATEWAY. Use that address as a
      # /32 — the subnet would also trust postgres and redis. Read it off the
      # running network, do not guess it.
      RELAY_TRUSTED_PROXY: ${RELAY_TRUSTED_PROXY:-}
      # Empty by default, and empty means the relay REFUSES to store a push token
      # rather than storing one in the clear (docs/BACKEND.md §2.9). Wired here
      # because config.Load reads it and main passes it to the store: without this
      # line, setting it in .env has no effect on the container at all, and the
      # symptom is a refusal that reads like a code bug. Set it with P8.S02, which
      # brings the endpoint that first writes a token.
      RELAY_PUSH_TOKEN_KEY: ${RELAY_PUSH_TOKEN_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    volumes:
      # The only writable path in the container. read_only: true below makes the
      # rest of the filesystem immutable, so this is the entire write surface —
      # and it holds ciphertext the client encrypted before it arrived.
      - blob-data:/var/lib/cipher/blobs
    # Defence in depth for a container that already has no shell: even with
    # arbitrary code execution there is nothing to write except the blob
    # directory, and nothing to escalate.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # No cap_add: the runtime image is `scratch` running one static binary as
    # uid 65532, and it binds 8080 rather than a privileged port.
    #
    # Modest against the datastores because it is the smaller process: one
    # goroutine per request, no query planner, and attachments stream to disk
    # rather than being buffered. The ceiling matters anyway — a container with
    # no memory limit under an upload flood is the one the OOM killer chooses,
    # and it takes the whole compose stack's headroom with it on the way.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

networks:
  internal:
    # No `external: true`, no host networking. Compose creates a bridge network
    # that only these three services join.
    driver: bridge

volumes:
  postgres-data:
  blob-data:
