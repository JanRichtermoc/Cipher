# Cipher — nginx http-level hardening.
#
# Installed as /etc/nginx/conf.d/00-cipher-hardening.conf. See docs/RUNBOOK-VPS.md §H.4.
#
# Copyright (C) 2026 Jan Richter
# SPDX-License-Identifier: AGPL-3.0-only
#
# This file exists in the repository rather than only in a runbook heredoc so it can be
# reviewed in a diff and checked by a gate (AUDIT 5.29). A configuration that lives only
# as a shell snippet in a document is a configuration nobody can verify.

# THREAT_MODEL.md §3.6. Deliberately absent: $request / $request_uri (a populated path
# such as /v1/keys/3f2b… is a metadata record hiding in a log line, which is why
# httpx.pattern() strips it from application logs), $http_user_agent and $http_referer
# (fingerprinting surface, no triage value for a native-app API).
log_format minimal '$remote_addr $request_method $status $body_bytes_sent $request_time';

# Off for every server, not just the relay vhost.
#
# It was set only inside the TLS vhost, so the port-80 redirect and the catch-all
# default server answered with `Server: nginx/1.24.0` — a free version disclosure on
# exactly the two endpoints an unauthenticated scanner reaches first (AUDIT 5.29).
# Ubuntu ships this line commented out in nginx.conf, so the default is `on`.
server_tokens off;
