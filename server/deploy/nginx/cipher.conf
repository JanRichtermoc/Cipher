# Cipher — nginx virtual hosts.
#
# Installed as /etc/nginx/sites-available/cipher. See docs/RUNBOOK-VPS.md §H.5.
#
# Copyright (C) 2026 Jan Richter
# SPDX-License-Identifier: AGPL-3.0-only
#
# In the repository rather than only in a runbook heredoc, so it is reviewable in a diff
# and checkable by a gate (AUDIT 5.29). Requires 00-cipher-hardening.conf for the
# `minimal` log format and the http-level `server_tokens off`.
#
# # Every server block states its own access_log, and that is the finding
#
# Only the TLS vhost below used to. The other two inherited nginx.conf's http-level
# `access_log /var/log/nginx/access.log;` — no format named, so nginx's built-in
# **combined**: client IP, the full request line, the referrer and the user agent. Stock
# Ubuntu logrotate then keeps `/var/log/nginx/*.log` for **14 daily generations**.
#
# So the two endpoints an unauthenticated scanner reaches first — the port-80 redirect
# and the catch-all default server — retained for a fortnight exactly what
# `httpx.pattern()` strips from application logs and what the `minimal` format below was
# written to exclude. A request to `http://relay.mgchatman.app/v1/keys/<uuid>` is a
# metadata record: it names who was looked up. Redirecting it to HTTPS does not stop it
# having been written down first.
#
# Inheritance is why this is stated three times rather than once. `access_log` directives
# at the same level *accumulate* — a second one at http level adds a second log rather
# than replacing the first — so the only reliable way to stop a server writing the
# inherited log is to say so in that server.

# Unmatched Host (scanners hitting the bare IP) gets nothing at all.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # ssl_protocols MUST be here, not only in the relay block below. nginx negotiates the
    # TLS version from the DEFAULT server's context for the listening socket, BEFORE SNI
    # selects a virtual server — so a per-server ssl_protocols is applied too late to
    # refuse anything. Omit this and Ubuntu's nginx.conf line 33
    # ("TLSv1 TLSv1.1 TLSv1.2 TLSv1.3") governs the socket: the config reads as 1.3-only
    # and the server accepts 1.2. `nginx -t` passes either way. AUDIT 5.16.
    ssl_protocols TLSv1.3;
    ssl_reject_handshake on;

    # This server answers 444 — it closes the connection without a response. There is
    # nothing here worth a log line, and what would be logged is a scanner's chosen URI
    # against our IP. AUDIT 5.29.
    access_log off;
    error_log  /var/log/cipher/cipher-error.log warn;

    return 444;
}

# HTTP: ACME challenges, and a redirect to HTTPS for everything else.
server {
    listen 80;
    listen [::]:80;
    server_name relay.mgchatman.app;

    # AUDIT 5.29. A redirect discloses nothing by design, and its log line disclosed
    # everything the TLS vhost's format was written to omit — including the path, because
    # a client that sends `GET /v1/keys/<uuid>` over http:// has already put it on the
    # wire, and this is where it was written to disk.
    access_log off;
    error_log  /var/log/cipher/cipher-error.log warn;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

# The relay.
server {
    # The `http2` parameter of `listen`, not the `http2 on;` directive: that directive
    # arrived in nginx 1.25.1 and 24.04 ships 1.24.0, where it is an "unknown directive"
    # and nginx -t fails. This form works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.mgchatman.app;

    ssl_certificate     /etc/letsencrypt/live/relay.mgchatman.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.mgchatman.app/privkey.pem;

    # 1.3 only. The sole client is a pinned iOS app; there is no legacy peer to
    # accommodate, and every downgrade-negotiation problem disappears with 1.2.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # Tickets are a forward-secrecy hazard: one stolen ticket key retrospectively opens
    # every session that used it.
    ssl_session_tickets off;
    # No ssl_stapling: Let's Encrypt retired OCSP in favour of CRLs.

    # Staging: short, no includeSubDomains, no preload. A long max-age on a name that may
    # be repurposed is a commitment browsers will not let you withdraw.
    add_header Strict-Transport-Security "max-age=300" always;

    # Also set at http level in 00-cipher-hardening.conf. Kept here so this file remains
    # correct on its own if that one is ever missing.
    server_tokens off;

    # THREAT_MODEL.md §3.6 permits IP retention on "a short operational TTL", and
    # httpx.Log deliberately keeps the client IP out of application logs so that triage
    # data lives here instead, with its own lifetime. So: log, but on the 'minimal'
    # format, and rotate at 24h.
    #
    # The default 'combined' format is NOT usable: it logs $request, which means
    # /v1/keys/3f2b… — the populated-path leak that httpx.pattern() exists to prevent in
    # application logs. Recording it in the proxy instead would defeat the control rather
    # than relocate it. The minimal format has no URI.
    #
    # NOT under /var/log/nginx: the stock logrotate globs that directory at rotate 14 and
    # would silently claim these files, making the 24h retention claim false. logrotate
    # calls the collision a "duplicate log entry" and the winner depends on filename
    # ordering. See §H.4.
    access_log /var/log/cipher/cipher-access.log minimal;
    error_log  /var/log/cipher/cipher-error.log warn;

    # Blobs are capped at 100 MiB by the relay. 101m lets the RELAY produce its own tested
    # 413 instead of Nginx short-circuiting with an untested one.
    client_max_body_size 101m;
    client_body_timeout  120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        # SET, not add: both of these OVERWRITE whatever the client sent, which is the
        # entire reason the relay may trust them. X-Forwarded-For is deliberately
        # collapsed to the single real peer rather than appended to — a forwarded chain is
        # a list of values an attacker chose. See §H.0.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
