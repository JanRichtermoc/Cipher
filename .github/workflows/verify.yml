# Cipher — the only CI job.
#
# It runs `Scripts/verify-all.sh`, which is also what a developer runs locally. One gate,
# one definition: a check that exists only in CI is a check nobody can reproduce, and a
# check that exists only locally is a check nobody runs.
#
# Closes AUDIT 1.6 once this is green on main and required on PRs.
#
# **Every action is pinned to a full commit SHA, never a tag.** This is the same reasoning
# AUDIT 1.3 applies to libsignal: `@v4` is a mutable pointer a maintainer or an attacker can
# move, and the code behind it runs here with a token that can write to this repository — a
# strictly larger blast radius than the dependency the project already pins by commit. The
# trailing `# vX.Y.Z` is the human-readable label and what Dependabot rewrites; see
# .github/dependabot.yml, which is how these stay current without anyone chasing them.
#
# Copyright (C) 2026 Jan Richter
# SPDX-License-Identifier: AGPL-3.0-only

name: verify

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the two checks most likely to break are ones no code change triggers:
  # an upstream libsignal tag being moved, and a published checksum changing.
  schedule:
    - cron: "17 4 * * 1"

# A queued run must not start while another holds the simulator (AUDIT 6.6). Never raise
# this to a matrix: the crypto tests are app-hosted and two concurrent `xcodebuild test`
# runs against one simulator fail preflight with "RequestDenied ... Busy".
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Pinned rather than `macos-latest`: a runner image bump changes the Xcode version,
    # and this project pins its toolchain (Vendor/libsignal/PINS.env records what the
    # supply-chain evidence was gathered against).
    #
    # It must be macos-26. The project targets iOS 26.5 and builds with Xcode 26.6, and
    # the macos-15 image ships macOS 15 with Xcode 16 and iOS 18 simulators — it could not
    # have built this at all. macos-26 has been generally available since 2026-02-26.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so a tag/commit check can resolve; the supply-chain script
          # queries the remote, but a shallow clone hides local tag state.
          fetch-depth: 0

      - name: Select the pinned Xcode
        # Read from PINS.env rather than hard-coded here. PINS.env is the single source of
        # truth and says in as many words that nothing may hard-code its values — and the
        # version that hard-coded `/Applications/Xcode_26.app` was also simply wrong: the
        # runner installs versioned paths like `Xcode_26.6.app`, so the step could only
        # ever have failed. Failing loudly when the pinned Xcode is absent is the point;
        # silently building with the image default would invalidate the supply-chain
        # evidence that PINS.env records.
        run: |
          set -euo pipefail
          source Vendor/libsignal/PINS.env
          app="/Applications/Xcode_${VERIFIED_XCODE}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode ${VERIFIED_XCODE} (pinned in PINS.env) is not on this runner."
            echo "Available:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -switch "$app"

          # Capture first, match second — never pipe xcodebuild into something that exits
          # early. `xcodebuild -version | head -1 | grep -q` looks harmless and is not:
          # grep exits on its first match, head exits after one line, and xcodebuild then
          # takes SIGPIPE on write. It does not handle SIGPIPE — it raises
          # NSFileHandleOperationException and aborts — so with `pipefail` a *successful*
          # match becomes a failed pipeline. It is a race, which is why it passed locally
          # and failed here on the run that merged it.
          version_output="$(xcodebuild -version)"
          version_line="${version_output%%$'\n'*}"
          case "$version_line" in
          *"$VERIFIED_XCODE"*) echo "using $version_line" ;;
          *)
            echo "::error::xcode-select did not take effect: expected ${VERIFIED_XCODE}, got '${version_line}'"
            exit 1
            ;;
          esac

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -i ios

      - name: Set up Go for the relay
        # Pinned explicitly rather than relying on the image's preinstalled Go.
        # The first version of gate 4 assumed the runner had one; macos-26 does not
        # put it on PATH, so the gate failed with "the Go toolchain is not on PATH"
        # — which is the correct behaviour (a gate that skips when its toolchain is
        # missing passes without having run) but is not a fixed toolchain.
        #
        # go-version-file reads server/go.mod, so the CI version and the version the
        # module declares cannot drift apart. go.mod names 1.25.0, which is the
        # measured floor rather than a guessed one: 1.23 was written first, and
        # building under it fails because pgx v5.10.0 declares `go >= 1.25.0`.
        # Verified by building under both.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # vendor/ is committed, so there is nothing to download and nothing to
          # cache. Leaving the cache on would warn about a missing go.sum lookup
          # path on every run.
          cache: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # Resolved from .ruby-version, which exists so CI and a developer machine agree.
          # Without it this step fails outright — the Gemfile carries no `ruby` directive,
          # so there is nothing else for setup-ruby to read. Gemfile.lock also carries
          # per-gem checksums, which need a modern bundler to verify rather than ignore.
          bundler-cache: true

      - name: pod install
        run: bundle exec pod install

      - name: Boot the simulator once, up front
        # Booting inside the test step is where the "Busy" preflight failure comes from.
        # Doing it here, once, makes that failure mode rare rather than routine.
        run: |
          xcrun simctl boot "iPhone 17 Pro" || true
          xcrun simctl bootstatus "iPhone 17 Pro" -b || true

      - name: Assert the simulator can actually run this app
        # The runner ships iOS 26.2, 26.4 and 26.5 runtimes; the app's deployment target is
        # 26.5, so two of the three cannot install it. `OS=latest` in the destination picks
        # the newest, but if a future image drops 26.5 the failure would surface as an
        # opaque install error inside the test step. Say it here instead.
        run: |
          set -euo pipefail
          # Same SIGPIPE trap as the Xcode step above: `awk … {exit}` stops reading, and
          # xcodebuild aborts rather than tolerating the closed pipe. This one happened to
          # win the race on the run that exposed the other, which is the worse outcome —
          # a latent flake instead of an honest failure. Buffer, then parse.
          settings="$(xcodebuild -workspace Cipher.xcworkspace -scheme Cipher \
                        -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
                        -showBuildSettings 2>/dev/null)"
          target="$(printf '%s\n' "$settings" \
                    | awk -F' = ' '/ IPHONEOS_DEPLOYMENT_TARGET /{print $2; exit}')"
          newest="$(xcrun simctl list runtimes --json \
                    | python3 -c 'import json,sys; rs=[r["version"] for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and r["isAvailable"]]; print(max(rs, key=lambda v: [int(x) for x in v.split(".")]))')"
          echo "deployment target $target, newest available iOS runtime $newest"
          python3 - "$target" "$newest" <<'PY'
          import sys
          t, n = ([int(x) for x in a.split(".")] for a in sys.argv[1:3])
          if n < t:
              sys.exit(f"::error::no simulator runtime satisfies the {sys.argv[1]} deployment target")
          PY

      - name: Verify
        # The whole gate, ten steps: supply chain, app-target manifest, redaction, UI
        # honesty and localization drift, the module-boundary check, the crypto tests, both
        # builds, the Release-bundle debug-affordance audit, and the required-reason API
        # check. Deliberately no test count here — a number in a comment goes stale and
        # then quietly lies; verify-all.sh prints the real one.
        run: ./Scripts/verify-all.sh

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cipher-verify-tests
          path: /tmp/cipher-verify-tests.log
          if-no-files-found: ignore

  # The relay's integration suite, against a real Postgres and a real Redis.
  #
  # A separate job on Linux, and it has to be. GitHub's macOS runners are virtual machines
  # without a Linux container runtime, so the `verify` job above cannot start Postgres at
  # all — which is why `verify-all.sh` gate 4 covers only what runs without a container and
  # this job covers the rest. Splitting them is not a preference; running these on macos-26
  # is not an option that exists.
  #
  # Linux runners also bill at 1x rather than 10x, so this is close to free.
  relay-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-go step: the suite runs inside a digest-pinned golang container on the
      # compose network (docker-compose.test.yml), so the runner's own Go is irrelevant.
      # Docker and the compose plugin are preinstalled on ubuntu-24.04.

      - name: Generate a throwaway .env
        # The real one is gitignored and holds this machine's local passwords. CI needs
        # credentials that exist only for the length of this job, so it makes its own —
        # from /dev/urandom, never a fixed literal. A hardcoded CI password is a real
        # password the moment someone copies the workflow to a deployment.
        run: |
          set -euo pipefail
          cd server
          cp .env.example .env
          pg="$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
          rd="$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=${pg}/" .env
          sed -i "s/^REDIS_PASSWORD=$/REDIS_PASSWORD=${rd}/" .env
          # Fail loudly rather than proceed with an empty password, which compose would
          # accept and Postgres would then refuse in a much less obvious way.
          ! grep -qE '^(POSTGRES|REDIS)_PASSWORD=$' .env

      - name: Integration suite
        run: ./Scripts/verify-relay-integration.sh

  # Releases must never pass because a check was skipped. `verify-all.sh --offline` exists
  # for working on a plane; it prints a warning and moves on, and that must not be how a
  # release-tagged build reaches green.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/')
    # Same image as `verify` on purpose. The script needs no Xcode — curl, git, shasum,
    # tar, awk — and Linux would be cheaper, but a release gate is the wrong place to
    # introduce a second environment whose tool differences nobody has tested.
    runs-on: macos-26
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Supply chain must be verified online for a release
        run: ./Scripts/verify-supply-chain.sh
